model:
  hidden_dims : [1536, 768, 192]


data_loader:
  batch_size : 
  - 128
  - 256
  - 512
  - 1024
  - 2048

training:
  n_epochs : 5
  eval_every_epochs: 5
  save_interm_embeds : False
  lr :
  - !!float 1e-1
  - !!float 5e-2 
  - !!float 2e-2 
  - !!float 1e-2 
  - !!float 5e-3
  - !!float 2e-3
  - !!float 1e-3
  scale : !!float 1
  loss_class : "infonce.InfoNCECauchy"

  
hyperparameter_sweep:
- data_loader.batch_size
- training.lr


